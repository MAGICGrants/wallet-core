# L3 + L5: builds monero_c for the host, generates the fixture corpus from it,
# and drives the shared core against both.
#
# This started life as a one-off spike proving that a package-level test can load
# monero_c via `monero.libPath` and make real calls. That worked, so it is now the
# standing L3/L5 tier — the only place anything here is exercised against the
# library we actually ship rather than against `FakeMoneroBackend`.
#
# **Nightly, not per-push.** Building Monero and its depends from source takes
# tens of minutes, which does not belong on a pull request. The consequence is
# worth stating plainly: between nightly runs, a change to `wallet_monero` is
# covered by L1/L2 only, and neither of those has ever seen a real wallet file.
name: Native (L3 + fixture corpus)

on:
  schedule:
    # 04:20 UTC daily. Off the hour, because everyone else picks the hour.
    - cron: '20 4 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.7
  TARGET: x86_64-linux-gnu

jobs:
  build-monero-c:
    name: Build monero_c
    runs-on: ubuntu-latest
    # Same digest-pinned image as the app's x86_64-linux-gnu job, so this
    # exercises the real reproducible path rather than an ad-hoc build.
    container:
      image: debian:bookworm@sha256:30482e873082e906a4908c10529180aefb6f77620aea7404b909829fadc5d168
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Reads the clone URL and commit from this repo's committed pubspec.lock.
      - name: Build
        env:
          TARGET_ARCH: x86_64-linux-gnu
        run: scripts/build-moneroc-ci.sh

      - name: Collect
        run: |
          mkdir -p artifacts
          cp monero_c/monero_libwallet2_api_c/build/"$TARGET"/libwallet2_api_c.so \
             artifacts/monero_libwallet2_api_c.so
          bash scripts/fix-linux-moneroc-execstack.sh artifacts/monero_libwallet2_api_c.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monero-c-x86_64-linux-gnu
          path: artifacts/monero_libwallet2_api_c.so

  corpus:
    name: Fixture corpus + real-FFI tests
    runs-on: ubuntu-latest
    needs: build-monero-c
    env:
      MONERO_LIB_PATH: ${{ github.workspace }}/native/monero_libwallet2_api_c.so
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monero-c-x86_64-linux-gnu
          path: native

      - run: flutter pub get

      # The known-answer gate, and it runs FIRST. `--verify` builds a throwaway
      # corpus in a temp directory and diffs it against the committed manifest,
      # so it cannot "fix" the drift it is looking for. A changed address here
      # means the derivation changed — either the bug you were looking for, or a
      # deliberate change whose manifest update belongs in the same commit.
      #
      # On the very first run there is no committed manifest for the wallet-file
      # fixtures, so this step fails by design; commit the manifest from the
      # artifact below and it goes green.
      - name: Verify the corpus against the committed manifest
        working-directory: packages/wallet_monero
        run: dart run tool/make_fixtures.dart --verify

      # Now generate for real, so the consumer test has files to open.
      - name: Generate the corpus
        working-directory: packages/wallet_monero
        run: dart run tool/make_fixtures.dart

      # REQUIRE_* turns "not available" from a skip into a failure, so a broken
      # build or a missing corpus cannot leave this job green.
      - name: wallet_monero (real FFI + corpus)
        working-directory: packages/wallet_monero
        env:
          REQUIRE_MONERO_FFI: '1'
          REQUIRE_FIXTURE_CORPUS: '1'
        run: flutter test --no-pub

      # Uploaded unconditionally, and it is `MANIFEST.generated.json` rather than
      # `MANIFEST.json` on purpose. The verify step writes the former whether it
      # passes or fails; the latter is whatever the checkout already had. On a
      # first run — which fails by design, there being no known answers yet — this
      # is the file to commit, and uploading the checked-out one instead would
      # hand you back exactly what you already have.
      - name: Upload the generated manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-manifest
          path: test_fixtures/wallets/MANIFEST.generated.json
          if-no-files-found: warn
