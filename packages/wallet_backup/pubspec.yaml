name: wallet_backup
description: "Seed-keyed metadata backup: payment destinations, transaction keys and the address book, as many small sealed files. The format, merging and the backup service. No platform channels; files are sealed with libsodium through fhse_native."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  wallet_domain:
    path: ../wallet_domain
  wallet_infra:
    path: ../wallet_infra

  # Carrot's keyed BLAKE2b (through wallet_domain) and Keccak for Monero
  # address checksums.
  pointycastle: 3.9.1

  ffi: 2.1.4
  # libsodium's XChaCha20-Poly1305, which seals every file (wfhse.h). The same
  # commit wallet_fhse pins.
  fhse_native:
    git:
      url: https://github.com/MAGICGrants/fhse_native
      ref: 7aad37cb20b9cc7a545e0e3d044d18664a99d636 # main

dev_dependencies:
  flutter_test:
    sdk: flutter
