name: wallet_fhse
description: "vtnerd's FHSE (FIDO2 hmac-secret encryption) guarding the wallet password: a C library (FHSE, libcbor, libsodium) behind wallet_domain's WalletPasswordGuard."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: 3.11.5
  flutter: 3.41.7

dependencies:
  flutter:
    sdk: flutter
  # The shared security-key screens (lib/security_keys_ui.dart) and their
  # strings (lib/src/l10n).
  flutter_localizations:
    sdk: flutter
  intl: any
  # For `WalletPasswordGuard`, `SeedSource` and the stores. The dependency runs
  # this way, as wallet_openalias's does: an app can take the wallet layer
  # without this package's native build.
  wallet_domain:
    path: ../wallet_domain
  wallet_infra:
    path: ../wallet_infra
  wallet_ui:
    path: ../wallet_ui

  ffi: 2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  polyseed: 0.0.7

flutter:
  # gen-l10n for lib/src/l10n (l10n.yaml); the output is committed.
  generate: true
  plugin:
    platforms:
      # FFI for the FHSE C library; on Android also the security key channel
      # (WalletFhsePlugin, Kotlin + YubiKit). On iOS that channel is still the
      # app's own Swift: YubiKit Swift is a Swift package, which a CocoaPods
      # plugin cannot depend on. See README.md.
      android:
        ffiPlugin: true
        package: org.magicgrants.wallet_fhse
        pluginClass: WalletFhsePlugin
      ios:
        ffiPlugin: true
