name: wallet_monero
description: "Monero CryptoWallet implementation: LWSF and full-node modes, polyseed and BIP39, subaddresses."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: 3.11.5
  flutter: 3.41.7

dependencies:
  flutter:
    sdk: flutter
  wallet_domain:
    path: ../wallet_domain
  wallet_infra:
    path: ../wallet_infra

  # One monero_c for both apps. The pin carries
  # Wallet_estimateTransactionFee (vtnerd's `lwsf` lacks it) plus lwsf fixes for
  # armv7 + mingw builds and insufficient-funds fee estimation. Track vtnerd's
  # lwsf again once these are upstreamed.
  monero:
    git:
      url: https://github.com/magicgrants/monero_c
      ref: 4595fb7bdabb5a99bd4ef29fc6d9f169cb600a64
      path: impls/monero.dart

  polyseed: 0.0.7
  # dart-bitcoin/bip39 has an unresolved bug that produces LOWER SEED ENTROPY
  # than intended (dart-bitcoin/bip39#23) and is no longer maintained. Cypher
  # Stack (Stack Wallet) maintain a fork with the fix, so we use theirs.
  #
  # The bug is in generation, not derivation — `mnemonicToSeed` and
  # `validateMnemonic` are unaffected — so the known-answer vectors in
  # wallet_monero/test/bip39_legacy_test.dart must not move when this pin
  # changes. If they do, something other than entropy generation changed and
  # the change is wrong.
  bip39:
    git:
      url: https://github.com/cypherstack/stack-bip39
      ref: 0cd6d54e2860bea68fc50c801cb9db2a760192fb # master @ 2023-06-07, includes the entropy fix
  bip32: 2.0.0
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # A **second, independent** Monero implementation, used by
  # test/fixture_known_answers_test.dart to cross-check the L5 corpus's recorded
  # addresses. Without it the manifest is only self-consistent: monero_c produced
  # those addresses, so comparing them to monero_c proves nothing. A pure-Dart
  # derivation agreeing with the C++ one is a real known answer.
  #
  # A **dev** dependency, so it does not transit to consumers — Skylight taking
  # wallet_monero still resolves neither this nor bitcoin_base.
  # The BRANCH ref matches bitcoin_base's own constraint; the workspace override
  # pins the revision to a SHA.
  blockchain_utils:
    git:
      url: https://github.com/cake-tech/blockchain_utils
      ref: cake-update-v2

# NOTE: the alias resolver is deliberately NOT a dependency here, and alias
# resolution is not a Monero concern at all. OA1/OA2 are resolved for every
# supported asset, so the injected `AliasResolver` lives on `CryptoWallet` in
# wallet_domain and the resolver itself is its own package,
# `wallet_openalias`. An app that resolves aliases depends on that
# directly; one that does not never resolves its crate.
