name: wallet_infra
description: "Transport, storage and logging primitives shared by MAGIC Grants wallets. No coin or app knowledge."
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: 3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter

  # PINNED to a SHA. `ref: main` in the apps was a reproducible-build and
  # supply-chain hole: an F-Droid rebuild of an old tag would pull whatever
  # main happened to be. Bump this deliberately, never implicitly.
  # MAGICGrants fork of cypherstack/tor: native-0.2.0 plus a build-hook fix
  # that makes the Tor library reproducible (fixed SOURCE_DATE_EPOCH, cargo
  # home remapped). The consuming apps must name the same URL.
  tor_ffi_plugin:
    git:
      url: https://github.com/MAGICGrants/tor
      ref: 72e455ffe1faecd5884bea7ec1da666f757a8f0e

  path_provider: 2.1.5
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  share_plus: 11.1.0
  # storage/export_file.dart: the save dialog on a desktop OS (a phone shares).
  file_selector: 1.1.0
  # ui/biometric_auth.dart — app-lock device authentication.
  local_auth: 2.3.0
  # ui/notification_service.dart — local incoming-tx notifications.
  flutter_local_notifications: 19.5.0
  path: 1.9.1
  # storage/backup_exclusion.dart — CoreFoundation through dart:ffi (iOS).
  ffi: 2.1.4

  # WalletFileCrypto: AES-256-GCM (pointycastle) keyed by PBKDF2-HMAC-SHA256
  # (webcrypto -> BoringSSL via FFI, ~10-50x faster than pure Dart).
  pointycastle: 3.9.1
  webcrypto: 0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    # Mozilla's CA set (curl.se/docs/caextract.html). The only trust store for
    # TLS to a Monero server; see lib/src/net/cacert.dart.
    - assets/cacert.pem
